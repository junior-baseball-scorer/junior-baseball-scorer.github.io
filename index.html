<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>少年野球スコアブック(試作版)</title>
<style>
:root{--bg:#f4f6f3;--bg2:#fff;--ink:#1d2a22;--sub:#5f6f65;--line:#c9d3cc;--pri:#1f6f43;--run:#e8902a;--ball:#2f8f4f;--str:#d6a400;--out:#c8443a;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(70px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:10px 8px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.4}
button.primary{background:var(--pri);color:#fff;border-color:var(--pri)}
button.danger{background:var(--out);color:#fff;border-color:var(--out)}
button.big{width:100%;padding:16px;font-size:18px;font-weight:700}
input,select,textarea{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;color:var(--ink)}
textarea{min-height:110px;margin:8px 0;font-size:12px}
.hidden{display:none!important}
.page{max-width:560px;margin:0 auto;padding:10px}
h1{font-size:20px;margin:6px 0 10px}
h2{font-size:15px;margin:10px 0 6px}
h2 small{color:var(--sub);font-weight:400}
.card{background:var(--card);border-radius:12px;padding:10px 12px;margin:10px 0;box-shadow:0 1px 2px #0001}
label{display:block;font-size:13px;color:var(--sub);margin:6px 0}
label input,label select{margin-top:3px;color:var(--ink)}
label.chk{display:flex;align-items:center;gap:6px;padding-top:18px;color:var(--ink);font-size:14px}
label.chk input{width:22px;height:22px;margin:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;gap:8px;margin:8px 0}
.seg label{flex:1;margin:0}
.seg input{display:none}
.seg span{display:block;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:15px}
.seg input:checked+span{background:var(--pri);color:#fff;border-color:var(--pri)}
.note{color:var(--sub);font-size:12px}
.err{color:var(--out);font-size:14px;font-weight:700}
table.lineup{width:100%;border-collapse:collapse;table-layout:fixed}
table.lineup th{font-size:11px;color:var(--sub);font-weight:400}
table.lineup td{padding:2px}
table.lineup td.n{width:20px;text-align:center;color:var(--sub)}
table.lineup input.num{width:100%}
table.lineup select{padding:8px 2px}
/* 記録画面 */
.rec .top{display:flex;justify-content:space-between;align-items:baseline}
.inn{font-size:22px;font-weight:800}
.inn small{font-size:13px;font-weight:400;color:var(--sub)}
.timer{font-variant-numeric:tabular-nums;color:var(--sub);font-size:15px}
table.sb{width:100%;border-collapse:collapse;background:#183d2a;color:#fff;border-radius:8px;overflow:hidden;font-size:13px;margin:6px 0;table-layout:fixed}
table.sb th,table.sb td{text-align:center;padding:4px 0;font-variant-numeric:tabular-nums}
table.sb th{font-weight:400;color:#b9d4c3;font-size:11px}
table.sb .tn{width:22%;text-align:left;padding-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.sb th.cur{color:#ffd76a}
table.sb td.now{background:#2c6045}
table.sb td.r{font-weight:800;color:#ffd76a}
.banner{background:var(--pri);color:#fff;text-align:center;padding:10px;border-radius:10px;font-weight:800;margin:6px 0}
.tw{background:#fff1d6;color:#7a4b00;padding:8px;border-radius:8px;font-size:13px;margin:6px 0}
.field{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:12px;padding:4px 8px}
.dia{width:74%;max-width:340px}
.dia .rl{font-size:12px;font-weight:700;fill:var(--ink)}
.counts{flex:1;display:flex;flex-direction:column;gap:8px}
.counts div{display:flex;align-items:center;gap:6px}
.counts span{width:16px;font-weight:800}
.counts i{width:20px;height:20px;border-radius:50%;background:#e3e8e4;display:inline-block}
.counts i.b{background:var(--ball)}.counts i.s{background:var(--str)}.counts i.o{background:var(--out)}
.bat{background:var(--card);border-radius:12px;padding:8px 12px;margin:8px 0 6px;font-size:17px}
.bat .ord{color:var(--sub);font-size:14px}.bat .pos{color:var(--sub);font-size:13px}
.pseq{font-size:13px;color:var(--sub);min-height:16px;letter-spacing:2px}
.pit{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:8px 12px;border-left:6px solid var(--pri)}
.pit .pc{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.pit .pc small{font-size:13px;font-weight:400;color:var(--sub)}
.pit.warn{border-left-color:var(--str);background:#fff8dc}
.pit.over{border-left-color:var(--out);background:#ffe6e3}
.pmsg{width:100%;font-size:13px}
.pad{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.pad.dis{opacity:.35;pointer-events:none}
.pb{font-size:18px;font-weight:700;padding:18px 4px;border-width:2px}
.pb.ball{border-color:var(--ball);color:var(--ball)}
.pb.str{border-color:var(--str);color:#8a6a00}
.pb.dropb{grid-column:1/-1;padding:12px;font-size:16px;border-style:dashed;color:var(--out);border-color:var(--out)}
.g.dropo button{padding:16px 4px;font-size:17px}
.g.dropo small{font-weight:400;font-size:12px}
.pb.inplay{background:var(--pri);color:#fff;border-color:var(--pri)}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tools button{font-size:14px;padding:10px 2px}
.recent{margin-top:10px}
.ll{background:var(--card);border-radius:8px;padding:6px 10px;margin:4px 0;font-size:14px}
.ll .who{color:var(--sub);font-size:13px}
.ll .ps{color:var(--sub);font-size:12px;letter-spacing:1px}
.ll.sub{font-size:13px;color:var(--sub)}
.runs{background:var(--out);color:#fff;border-radius:6px;padding:0 6px;font-size:12px}
/* 記録画面:投球と結果のボタン(画面の下に固定して、スクロールしなくても押せるように) */
.ctl{position:sticky;bottom:calc(49px + env(safe-area-inset-bottom));z-index:3;background:var(--bg);margin:6px -10px 0;padding:6px 10px 6px;box-shadow:0 -6px 10px -8px #0004;border-top:1px solid #dfe6e1}
.pad5{grid-template-columns:repeat(4,1.2fr) repeat(2,.9fr);gap:5px;margin:0 0 6px}
.pad5 .pb{font-size:14px;padding:4px 0;min-height:48px;line-height:1.15;letter-spacing:-.5px;white-space:nowrap}
.pad5 .pb.rare{font-size:12px;font-weight:700;border-width:1.5px}
.pad5 .pb small{display:block;font-size:9px;letter-spacing:-.5px}
.pb.str{background:#fffbea}
.pb.fl{border-color:var(--str);color:#8a6a00;background:#fff3c4}
.pb.hbp{border-color:#d0342c;color:#b0281f}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 6px}
.rgrid.dis{opacity:.35;pointer-events:none}
.rcol{display:flex;flex-direction:column;gap:6px}
.rcol .rh{text-align:center;font-size:10px;font-weight:700;color:var(--sub);line-height:1}
.rb{padding:5px 2px;font-size:15px;font-weight:800;line-height:1.1;min-height:46px;border-width:1.5px}
.rb small{display:block;font-size:9.5px;font-weight:400;margin-top:1px;opacity:.85}
.rb:disabled{opacity:.25}
.c-hit{background:#e6f3e9;border-color:#2f8f4f;color:#1f6f43}.c-hit.k1{background:#2f7d45;color:#fff}
.c-out{background:#fdeceb;border-color:#c8443a;color:#a8322a}
.c-sac{background:#eaf1fb;border-color:#5b8bd0;color:#1f5fbf}
.c-run{background:#fff1e0;border-color:#e8902a;color:#9a5300}
.c-oth{background:#f3f1ea;border-color:#a99f86;color:#5a5240}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools2 button{font-size:15px;padding:10px 2px;min-height:44px}
.top .tb{display:flex;align-items:center;gap:6px}
button.endb{border-color:var(--out);color:var(--out);background:#fff;font-weight:700}
.tips{background:#eef4fd;border:1px solid #9fbbe0;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;line-height:1.6}
.tips ul{margin:4px 0 6px;padding-left:18px}
#toast .tundo{margin-left:8px;background:#fff;color:#222;border:0;padding:6px 12px;font-weight:700}
.latbtn{width:100%;margin-top:8px;border:2px dashed var(--run);color:#9a5300;background:#fff8ee;font-weight:700;min-height:44px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.g3 button{padding:10px 2px;font-size:14px;font-weight:700;min-height:44px}
.g3 button small{display:block;font-size:10px;font-weight:400}
.g3 button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
/* 縦の短い画面(iPhone SE など):上の表示を詰めて、グラウンド・打者・投手が下のボタンの上に見えるように */
@media (max-height:760px){
  .rec .inn{font-size:18px}.rec .top button.mini{padding:3px 8px}
  table.sb{font-size:12px;margin:4px 0}table.sb th,table.sb td{padding:2px 0}
  .dia{width:62%}.field{padding:2px 6px}
  .bat{padding:4px 10px;margin:4px 0;font-size:15px}.pit{padding:4px 10px}.pit .pc{font-size:20px}
  .tips{font-size:12px;line-height:1.45}
}
/* 学年の色(選手の札の左の帯) */
.gr6{border-left:6px solid #2f6fd6!important}.gr5{border-left:6px solid #2f9e52!important}.gr4{border-left:6px solid #e0b000!important}.gr3{border-left:6px solid #9aa4ac!important}
.grl{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;color:var(--sub);margin:4px 0}
.grl i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:2px}
.fpick{display:block;width:100%;max-width:440px;margin:4px auto;user-select:none;-webkit-user-select:none}
.fpick .fpz{cursor:pointer}
.locrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.locrow button{padding:10px 2px;font-size:13px;font-weight:700;line-height:1.2}
.locrow button.on,.g2 button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.g2 button{padding:12px 4px;font-size:15px;font-weight:700}
.g2 button small{display:block;font-size:11px;font-weight:400;color:var(--sub)}.g2 button.on small{color:#cfe8da}
.g2 button.ro2{border-color:var(--out);color:var(--out);background:#fdf3f2}.g2 button.ro2.on{background:var(--out);color:#fff}
.must{color:var(--out);font-size:12px;font-weight:700;margin-left:4px}
.dia .rtap{cursor:pointer}
/* 守備位置・交代の図 */
.fld{position:relative;width:100%;max-width:420px;margin:6px auto;aspect-ratio:1/0.98;touch-action:pan-y}
.fld svg.bg{position:absolute;inset:0;width:100%;height:100%}
.fz{position:absolute;transform:translate(-50%,-50%);width:27%;min-height:46px;border:2px dashed transparent;border-radius:10px;padding:2px;display:flex;flex-direction:column;align-items:stretch;gap:2px}
.fz .fzl{text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #0008}
.fz.bad{border-color:#ff5a4f;background:#ff5a4f33}
.fz.hov{border-color:#ffd76a;background:#ffd76a55}
.fz.empty .fzl{color:#ffe0dc}
.fchip{background:#fff;border:1.5px solid #c9d3cc;border-radius:8px;padding:3px 4px;font-size:12px;font-weight:700;line-height:1.2;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 1px 2px #0003;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.fchip .cno{display:block;font-size:11px;color:var(--sub);line-height:1.1}.fchip .cno b{color:var(--pri);font-size:12px;margin-right:3px}
.fchip .cnm{display:block;line-height:1.15}
.fchip.sel .cnm{text-decoration:underline}
.fchip small{display:block;font-size:10px;font-weight:400;color:var(--sub)}
.fchip.chg{border-color:var(--run);background:#fff3e2}
.fchip.sel{border-color:var(--pri);box-shadow:0 0 0 3px #1f6f4366}
.fchip.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.08)}
.fchip.dragging{opacity:.35}
.fbench{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fbench .fchip{min-width:92px;max-width:140px}
.fbench .fchip.on{border-color:var(--pri);background:#eef4ef}
.nextbat{background:var(--pri);color:#fff;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}.nextbat b{font-size:20px;margin:0 4px}.nextbat small{display:block;font-size:12px;opacity:.9}
.pz2{display:inline-block;min-width:28px;text-align:center;background:#e8efe9;color:var(--pri);border-radius:6px;padding:3px 2px;font-weight:800;font-size:13px}
.ann{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;font-size:14px;line-height:1.7}
.flu{font-size:12px;color:var(--sub);line-height:1.6;margin-top:6px}
.flu b{color:var(--ink)}
/* モーダル */
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
.sheet h3{margin:2px 0 10px;font-size:17px}
.grp{margin-bottom:8px}.gt{font-size:12px;color:var(--sub);margin-bottom:4px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g button{padding:14px 4px;font-size:16px;font-weight:700}
.g button:disabled{opacity:.25;border-style:dashed}
.g button.hit{border-color:var(--ball);color:var(--ball)}
.g button.out{border-color:var(--out);color:var(--out)}
.g button.on,.seg2 button.on,.slots button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fpad button{padding:10px 2px;font-size:14px}
.fpad b{display:block;font-size:22px}
.seq{text-align:center;font-size:20px;font-weight:800;margin:10px 0}
.mb{display:flex;gap:8px;margin-top:12px}
.mb button{flex:1;padding:14px;font-size:16px;font-weight:700}
.rr{background:var(--card);border-radius:10px;padding:8px;margin:6px 0}
.rlab{font-weight:700;margin-bottom:6px}
.ro{display:flex;flex-wrap:wrap;gap:6px}
.ro button{flex:1;min-width:58px;padding:10px 2px;font-size:14px}
.ro button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.ro button.o.on{background:var(--out);border-color:var(--out)}
.ro button.h.on{background:var(--run);border-color:var(--run)}
.rr.fixed .rlab{margin:0}.fo{color:var(--out)}.fh{color:var(--pri)}
.fpad b{display:block;font-size:22px}
.fpad button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.fpad button:disabled{opacity:.25}
.rfbox{background:var(--card);border-radius:10px;padding:8px;margin-top:8px}
.mpad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.mpad button{padding:6px 0;font-size:17px;font-weight:700;min-height:46px}
.mpad small{display:block;font-size:10px;font-weight:400;color:var(--sub)}
.rfseq{margin-top:6px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
button.mini{padding:4px 10px;font-size:12px}
.sum{text-align:right;font-weight:700;margin-top:6px}
.reasons{margin-bottom:6px}.g.bt{margin-bottom:12px}
.sheet .gt{font-size:12px;color:var(--sub);margin:4px 0}
.seg2{display:flex;gap:6px;margin-bottom:8px}.seg2 button{flex:1;font-size:14px}
.slots{display:grid;grid-template-columns:1fr;gap:4px}
.slots button{text-align:left;padding:8px 10px;font-size:15px}
.slots span{display:inline-block;width:22px;color:var(--sub)}
.slots em{float:right;font-style:normal;color:var(--sub)}
.slots button.on span,.slots button.on em{color:#cfe8da}
.subform{background:var(--card);border-radius:10px;padding:8px;margin-top:8px}
.lrows{display:flex;flex-direction:column;gap:4px}
.lrow{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;font-size:15px}
.lrow .o{width:18px;color:var(--sub);font-weight:700}
.lrow .pz{display:inline-block;min-width:30px;text-align:center;background:#e8efe9;color:var(--pri);border-radius:6px;padding:3px 4px;font-weight:800}
.lrow .nm{flex:1;min-width:0}.lrow .nm small{display:block;font-size:11px;color:var(--sub)}
.lrow.chg{border-color:var(--run);background:#fff6ea}.lrow.chg .pz{background:var(--run);color:#fff}
.lrow.on{border:2px solid var(--pri);box-shadow:0 0 0 2px #1f6f4322}
i.bdg{font-style:normal;font-size:11px;font-weight:700;background:var(--pri);color:#fff;border-radius:8px;padding:1px 7px}
i.bdg.run{background:var(--run)}
.act{background:#eef4ef;border-radius:10px;padding:8px;margin:0 0 6px}
.act .gt small{color:var(--sub)}
.bench{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.bench button{text-align:left;padding:10px 8px;font-size:14px;background:#fff}
.bench small{color:var(--sub);margin-left:4px;font-size:11px}
.pzpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pzpad button{padding:6px 2px;font-size:13px;background:#fff}
.pzpad b{display:block;font-size:15px}.pzpad small{display:block;font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pzpad button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.pzpad button.on small{color:#cfe8da}
.pend{background:#fff6ea;border:1px solid var(--run);border-radius:10px;padding:8px;margin-top:10px;font-size:14px;line-height:1.6}
.qs{margin-left:8px;vertical-align:middle}
.dlu{display:flex;flex-direction:column;gap:4px}
.drow{display:flex;align-items:center;gap:6px}
.drow .o{width:18px;text-align:center;color:var(--sub);font-weight:700}
.drow select{width:76px;flex:none;padding:8px 2px}
.pbtn{flex:1;text-align:left;padding:9px 10px;font-size:15px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn small{color:var(--sub);margin-left:6px;font-size:12px}
.pbtn.empty{border-style:dashed;color:var(--out);border-color:var(--out)}
.bench2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.bench2 button{text-align:left;padding:9px 8px;font-size:14px}
.bench2 small,.pick small{color:var(--sub);margin-left:4px;font-size:11px}
.bench2 button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.bench2 button.on small{color:#cfe8da}
.pick{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:8px}
.pick button{text-align:left;padding:10px 8px;font-size:14px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.pick button i.bdg{margin-left:auto}
.pick button.on{border:2px solid var(--pri);background:#eef4ef}
.lrowx{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #e3e9e4;font-size:14px;color:var(--sub)}
.lrowx small{font-size:11px;margin-left:4px}.lrowx button{margin-left:auto}
.rv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px}.rv small{color:var(--sub);margin-left:4px;font-size:11px}
i.bdg.prov{background:#8a6a00;margin-left:4px}
.gcard.cur{border:2px solid var(--pri)}
.gtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gsc{font-size:16px;margin:6px 0}.gsc small{color:var(--sub);font-size:11px;margin-left:4px}

<body>
<div id="app"></div>
<nav id="tabs" class="hidden">
  <button data-a="tab" data-k="rec">記録</button>
  <button data-a="tab" data-k="log">経過</button>
  <button data-a="tab" data-k="stats">成績</button>
  <button data-a="tab" data-k="list">一覧</button>
  <button data-a="tab" data-k="career">通算</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hidden"></div>
<script>
// ===== 記録エンジン:出来事の記録(events)から試合の状況と成績を計算する =====
const POS = { '1': '投', '2': '捕', '3': '一', '4': '二', '5': '三', '6': '遊', '7': '左', '8': '中', '9': '右' };
const POS_FULL = { '1': '投手', '2': '捕手', '3': '一塁', '4': '二塁', '5': '三塁', '6': '遊撃', '7': '左翼', '8': '中堅', '9': '右翼' };
const FIELDER_NAME = { '1': '投手', '2': '捕手', '3': '一塁手', '4': '二塁手', '5': '三塁手', '6': '遊撃手', '7': '左翼手', '8': '中堅手', '9': '右翼手' };
const RESULTS = {
  H1: { label: '単打', hit: 1, ab: 1 },
  H2: { label: '二塁打', hit: 2, ab: 1 },
  H3: { label: '三塁打', hit: 3, ab: 1 },
  HR: { label: '本塁打', hit: 4, ab: 1 },
  GO: { label: 'ゴロ', ab: 1 },
  FO: { label: 'フライ', ab: 1 },
  LO: { label: 'ライナー', ab: 1 },
  IFF: { label: 'インフィールドフライ', ab: 1 },
  DP: { label: '併殺', ab: 1 },
  SH: { label: '犠打', ab: 0 },
  SF: { label: '犠飛', ab: 0 },
  E: { label: '失策', ab: 1 },
  FC: { label: '野選', ab: 1 },
  CI: { label: '打撃妨害', ab: 0 },
  INT: { label: '守備妨害', ab: 1 },
  NP: { label: '打席途中', ab: 0 }, // 打席の途中で3アウト(打席に数えない。次の回もこの打者から)
  BB: { label: '四球', ab: 0 },
  HBP: { label: '死球', ab: 0 },
  K: { label: '空振り三振', ab: 1 },
  KC: { label: '見逃し三振', ab: 1 },
};
const RUN_REASONS = { SB: '盗塁', WP: '暴投', PB: '捕逸', BK: 'ボーク', CS: '盗塁死', PO: 'けん制死', RO: '走塁死', OT: 'その他', E: '失策', POE: '牽制悪送球', OB: '走塁妨害' };
// 外野への安打の位置(守備番号とは別に持つ)。line:線際 over:頭上を越えた 78:左中間 89:右中間
const OF_NAME = { '7': 'レフト', '8': 'センター', '9': 'ライト' };
function hitPlace(f, loc) {
  if (loc === '78') return '左中間';
  if (loc === '89') return '右中間';
  if (loc === 'line' && OF_NAME[f]) return OF_NAME[f] + '線';
  if (loc === 'over' && OF_NAME[f]) return OF_NAME[f] + '越え';
  return '';
}
function hitPlaceShort(f, loc) {
  if (loc === '78') return '左中';
  if (loc === '89') return '右中';
  if (loc === 'line') return POS[f] + '線';
  if (loc === 'over') return POS[f] + '越';
  return POS[f] || '';
}
const PITCH_LABEL = { B: 'ボ', C: '見', S: '空', F: 'フ', BF: 'バ', X: '打', HBP: '死' };

// 選手の識別:名簿のID(rid)があればID、なければ背番号(相手チームなど)。背番号・名前が変わっても同じ選手として集計する
function ident(p) { return p.rid ? 'r:' + p.rid : 'n:' + p.no; }
function pkey(side, p) { return side + ':' + (p.rid ? 'id:' + p.rid : p.no + ':' + (p.name || '')); }
function plabel(p) { return '#' + p.no + (p.name ? ' ' + p.name : ''); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function total(arr) { return arr.reduce((a, b) => a + (b || 0), 0); }

function initState(game) {
  return {
    inning: 1, half: 0, outs: 0, balls: 0, strikes: 0,
    vouts: 0, // 失策がなければ取れていたアウトも含めた数(自責点の判定に使う)
    bases: [null, null, null],
    next: [0, 0],
    lineups: clone(game.lineups),
    score: [[0], []], hits: [0, 0], errors: [0, 0],
    pitchCounts: {}, pa: null, log: [],
    paMeta: [], // 打席ごとの走者の軌跡(スコアブック表示用)
    bat: {}, pit: {}, fld: {}, order: [[], []],
    over: false, endReason: '',
  };
}

function battingSide(s) { return s.half; }
function fieldingSide(s) { return 1 - s.half; }
function currentBatter(s) {
  const side = battingSide(s), slot = s.next[side];
  return { side, slot, p: s.lineups[side][slot] };
}
function currentPitcher(s) {
  const side = fieldingSide(s);
  const slot = s.lineups[side].findIndex(p => p.pos === '1');
  return slot < 0 ? null : { side, slot, p: s.lineups[side][slot] };
}
function batStat(s, side, p) {
  const k = pkey(side, p);
  if (!s.bat[k]) {
    s.bat[k] = { side, label: plabel(p), PA: 0, AB: 0, H: 0, H2: 0, H3: 0, HR: 0, RBI: 0, R: 0, BB: 0, HBP: 0, K: 0, SB: 0, SH: 0, SF: 0 };
    s.order[side].push(k);
  }
  return s.bat[k];
}
function pitStat(s, side, p) {
  const k = pkey(side, p);
  if (!s.pit[k]) s.pit[k] = { side, label: plabel(p), grade: p.grade, P: 0, ST: 0, BF: 0, OUT: 0, H: 0, HR: 0, BB: 0, HBP: 0, K: 0, R: 0, ER: 0, WP: 0, BK: 0 };
  return s.pit[k];
}
// 守備位置にいる選手の守備成績
function fldStat(s, side, pos) {
  const p = s.lineups[side].find(x => x.pos === pos);
  if (!p) return null;
  const k = pkey(side, p);
  if (!s.fld[k]) s.fld[k] = { side, label: plabel(p), PO: 0, A: 0, E: 0, PB: 0, CS: 0, SBA: 0 };
  return s.fld[k];
}
// 刺殺・補殺:最後の野手が刺殺、それ以外が補殺。併殺は最後の2人が刺殺
function creditOuts(s, side, seq, outs, dp) {
  if (!seq || !seq.length || outs <= 0) return;
  const last = seq[seq.length - 1];
  const po = new Set([last]);
  if (dp && outs >= 2 && seq.length >= 2) po.add(seq[seq.length - 2]);
  po.forEach(f => { const st = fldStat(s, side, f); if (st) st.PO++; });
  const assists = new Set(seq.slice(0, -1));
  assists.forEach(f => { const st = fldStat(s, side, f); if (st) st.A++; });
}

// 押し出し(四球・死球・打撃妨害)のときの走者の動き
function walkMoves(bases) {
  const m = [{ from: 'B', to: 1 }];
  if (bases[0]) {
    m.push({ from: 1, to: 2 });
    if (bases[1]) {
      m.push({ from: 2, to: 3 });
      if (bases[2]) m.push({ from: 3, to: 4 });
    }
  }
  return m;
}
function forced(bases) {
  const f1 = !!bases[0], f2 = f1 && !!bases[1], f3 = f2 && !!bases[2];
  return [f1, f2, f3];
}
// 打球の結果ごとの、走者の動きの初期値(画面で修正できる)
function defaultMoves(result, bases) {
  const m = [];
  const f = forced(bases);
  const each = fn => { for (let b = 3; b >= 1; b--) if (bases[b - 1]) m.push({ from: b, to: fn(b) }); };
  switch (result) {
    case 'H1': case 'E': case 'FC': each(b => Math.min(b + 1, 4)); m.push({ from: 'B', to: 1 }); break;
    case 'H2': each(b => Math.min(b + 2, 4)); m.push({ from: 'B', to: 2 }); break;
    case 'H3': each(() => 4); m.push({ from: 'B', to: 3 }); break;
    case 'HR': each(() => 4); m.push({ from: 'B', to: 4 }); break;
    case 'GO': each(b => f[b - 1] ? b + 1 : b); m.push({ from: 'B', to: 'out' }); break;
    case 'FO': case 'LO': case 'IFF': case 'INT': each(b => b); m.push({ from: 'B', to: 'out' }); break;
    case 'SH': each(b => Math.min(b + 1, 4)); m.push({ from: 'B', to: 'out' }); break;
    case 'SF': each(b => b === 3 ? 4 : b); m.push({ from: 'B', to: 'out' }); break;
    case 'CI': return walkMoves(bases);
    case 'DP': {
      let lead = 0;
      for (let b = 3; b >= 1; b--) if (f[b - 1] && !lead) lead = b;
      each(b => b === lead ? 'out' : (f[b - 1] ? b + 1 : b));
      m.push({ from: 'B', to: 'out' });
      break;
    }
  }
  return m;
}

function ensureScoreCell(s) {
  const bs = battingSide(s);
  if (s.score[bs][s.inning - 1] == null) s.score[bs][s.inning - 1] = 0;
}

// 走者を動かす。opt.unearned:この出来事で入った得点は自責点にしない(失策・捕逸など)
function applyMoves(s, moves, batterRef, pitcher, opt) {
  opt = opt || {};
  const bs = battingSide(s);
  const nb = [null, null, null];
  const moved = new Set();
  let runs = 0, outs = 0, er = 0;
  const scorers = [];
  // アウトは本塁に近い走者から順に数える(打者走者は最後)
  const order = moves.slice().sort((x, y) => (y.from === 'B' ? 0 : y.from) - (x.from === 'B' ? 0 : x.from));
  for (const mv of order) {
    const ref = mv.from === 'B' ? batterRef : s.bases[mv.from - 1];
    if (!ref) continue;
    if (mv.from !== 'B') moved.add(mv.from);
    const meta = ref.paId != null ? s.paMeta[ref.paId] : null;
    const fromN = mv.from === 'B' ? 0 : mv.from;
    if (meta) {
      const lab = opt.outLabels ? (opt.outLabels[mv.from] || '') : '';
      if (mv.to === 'out') meta.out = { from: fromN, no: s.outs + outs + 1, by: opt.cause || '', label: lab, rs: opt.reason || '' };
      else if (mv.to > fromN) meta.path.push({ from: fromN, to: mv.to, by: mv.from === 'B' ? '' : (opt.cause || ''), rbi: !!opt.rbi && mv.to === 4 && mv.from !== 'B' });
    }
    if (mv.to === 'out') outs++;
    else if (mv.to === 4) {
      if (meta) meta.scored = true;
      runs++; scorers.push(ref);
      if (s.bat[ref.key]) s.bat[ref.key].R++;
      // 失点はその走者を出塁させた投手に付ける
      const earned = ref.er !== false && !opt.unearned && s.vouts < 3;
      if (meta) meta.earned = earned;
      const resp = s.pit[ref.pk] || (pitcher ? pitStat(s, pitcher.side, pitcher.p) : null);
      if (resp) { resp.R++; if (earned) resp.ER++; }
      if (earned) er++;
    } else nb[mv.to - 1] = ref;
  }
  for (let b = 1; b <= 3; b++) {
    if (s.bases[b - 1] && !moved.has(b) && !nb[b - 1]) nb[b - 1] = s.bases[b - 1];
  }
  s.bases = nb;
  s.outs += outs;
  s.vouts += outs + (opt.extraVout || 0);
  ensureScoreCell(s);
  s.score[bs][s.inning - 1] += runs;
  if (pitcher) pitStat(s, pitcher.side, pitcher.p).OUT += outs;
  return { runs, outs, er, scorers };
}

function endPA(s, game, result, moves, fielders, ev) {
  ev = ev || {};
  const pa = s.pa;
  const bs = battingSide(s), fs = fieldingSide(s);
  const b = currentBatter(s);
  const pit = currentPitcher(s);
  const bst = batStat(s, bs, b.p);
  const r = RESULTS[result];
  const dropPB = ev.drop && ev.drop.safe && ev.drop.cause === 'PB';
  const dropE = ev.drop && ev.drop.safe && ev.drop.cause === 'E'; // 振り逃げで捕手・一塁手などの送球の失策
  // 失策・打撃妨害・捕逸や送球の失策による振り逃げで出塁した走者の得点は自責点にならない
  const reachedByError = result === 'E' || result === 'CI' || dropPB || dropE;

// 打席をイニングごとの列に並べる(打者一巡したら列を増やす)
function bookColumns(side) {

      cols.push(cur);

  }
  // 各イニングの最後の打席

  const byInn = {};
  pas.forEach(l => { byInn[l.inning] = l; });
  const ended = new Set(S.log.filter(l => l.type === 'change' && l.half === side).map(l => l.inning));
  Object.values(byInn).forEach(l => { if (ended.has(l.inning) || (S.over && l.inning === S.inning)) lastIds.add(l.id); });
  // まだ打席のないイニングも、規定回までは空の列を出す
  const maxInn = Math.max(store.game.innings, ...cols.map(c => c.inning), 0);
  const out = [];
  for (let i = 1; i <= maxInn; i++) {
    const cs = cols.filter(c => c.inning === i);
    if (cs.length) cs.forEach((c, j) => out.push(Object.assign(c, { first: j === 0, span: cs.length })));

  const pitches = pas.reduce((a, l) => a + l.pitches.length, 0) + (!S.over && S.half === side && S.inning === inning && S.pa ? S.pa.pitches.length : 0);

// ゲーム風の打席一覧
function listNote(l) {

    case 'H2': return [(l.loc ? hitPlaceShort(f[0], l.loc) : p) + '2', 'hit'];
    case 'H3': return [(l.loc ? hitPlaceShort(f[0], l.loc) : p) + '3', 'hit'];
    case 'HR': return [(l.loc ? hitPlaceShort(f[0], l.loc) : p) + '本', 'hit'];
    case 'GO': return [p + 'ゴ', 'out'];
    case 'FO': return [p + (l.foul ? '邪' : '飛'), 'out'];
    case 'LO': return [p + (l.foul ? '邪直' : '直'), 'out'];
    case 'IFF': return [p + '飛', 'out'];
    case 'DP': return [p + '併', 'out'];
    case 'SH': return [p + 'ギ', 'bb'];
    case 'SF': return [p + '犠飛', 'bb'];
    case 'E': { const m = /([一二三遊投捕左中右])失/.exec(l.text); return [(m ? m[1] : '') + '失', 'err']; }
    case 'FC': return ['野選', 'err'];
    case 'CI': return ['打妨', 'err'];
    case 'INT': return ['守妨', 'out'];
    case 'NP': return ['途中', 'np'];
    case 'BB': return ['四球', 'bb'];
    case 'HBP': return ['死球', 'bb'];
    case 'K': return [l.b3 ? '3バ失' : /振り逃げ\(/.test(l.text) ? '振逃' : '空振', 'out'];
    case 'KC': return [/振り逃げ\(/.test(l.text) ? '振逃' : '見逃', 'out'];
  }
  return [l.text, 'out'];

function pickPlayer(i, id) {
  const d = ui.draft, j = d.order.findIndex(o => o.id === id), old = d.order[i].id;

}

// 表の貼り付けを読む:タブ・カンマ区切り、または空白区切り(先頭が背番号、最後が学年)。全角数字・「年」も可
function parseRosterPaste(text, usedNos) {
  const z2h = t => String(t || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[　]/g, ' ').trim();
  const used = new Set(usedNos), add = [], err = [];
  String(text || '').split(/\r?\n/).forEach((line, i) => {
    let c = z2h(line).split(/\t|,|、/).map(x => x.trim()).filter(Boolean);
    if (!c.length) return;
    if (c.length === 1) { const w = c[0].split(/\s+/); c = [w[0]]; if (w.length > 2 && /^[1-6]年?$/.test(w[w.length - 1])) c.push(w.slice(1, -1).join(' '), w[w.length - 1]); else c.push(w.slice(1).join(' ')); }
    const no = (c[0] || '').replace(/^#/, ''), name = c[1] || '', gm = /^([1-6])年?$/.exec(c[2] || '');
    if (!/^\d{1,3}$/.test(no)) { if (i === 0 && /背番号|番号|No/i.test(line)) return; err.push((i + 1) + '行目:背番号が読めません'); return; } // 見出しの行は飛ばす
    if (used.has(no)) { err.push('#' + no + ' は名簿にいるため追加しませんでした'); return; }
    used.add(no);
    add.push({ no, name, grade: gm ? gm[1] : '5' });
    if (c[2] && !gm) err.push('#' + no + ' の学年が読めないため5年にしました');
  });
  return { add, err };
}

function saveRosterRows(m) {
  const rows = m.rows.filter(p => p.id || p.no || p.name);
  const act = rows.filter(p => !p.left);
  if (act.some(p => !p.no)) { m.err = '背番号が空の選手がいます'; return false; }
  const nos = act.map(p => p.no), dn = nos.filter((n, i) => nos.indexOf(n) !== i);
  if (dn.length) { m.err = '在籍選手の背番号 ' + [...new Set(dn)].join('・') + ' が重複しています'; return false; }
  const now = Date.now();
  rows.forEach(p => {
    if (!p.id) { p.id = newPlayerId(); p.since = todayStr(); p.upd = now; return; }
    const o = rp(p.id);
    if (!o || o.no !== p.no || o.name !== p.name || o.grade !== p.grade || (o.left || '') !== (p.left || '') || o.prov) { p.upd = now; delete p.prov; } // 管理者が保存した選手は正式登録
  });

  if (ui.draft) { // 退団した選手は打順・控えから外す
    ui.draft.order.forEach(o => { if (o.id && !okId(o.id)) o.id = null; });

  }
  return true;
}

// 取り込み:IDごとに合流し、更新が新しいほうを採用する。退団の情報も引き継ぐ
function rosterImport(text) {
  const d = JSON.parse(text);
  if (d.format !== 'scorebook-roster' || !Array.isArray(d.players)) throw new Error('format');
  let add = 0, upd = 0;
  d.players.forEach(np => {
    if (!np || !np.id) return;
    const o = rp(np.id);
    if (!o) { roster.players.push(Object.assign({}, np)); add++; }
    else if ((np.upd || 0) >= (o.upd || 0)) { Object.keys(o).forEach(k => delete o[k]); Object.assign(o, np); upd++; }
  });
  if (d.team && !roster.team) roster.team = d.team;
  sortRoster(); saveRoster();
  if (ui.draft) { ui.draft.order.forEach(o => { if (o.id && !okId(o.id)) o.id = null; }); ui.draft.bench = ui.draft.bench.filter(okId); }
  return { add, upd };
}

// ---------- 試合の保存(複数試合) ----------
// 1試合ずつブラウザのデータベース(IndexedDB)に保存する。使えない環境では localStorage。画面で使うときは全試合をメモリに置く
const GKEY = 'scorebook_games_v2', CKEY = 'scorebook_current_v2', JKEY = 'scorebook_journal_v2';
let games = {};   // id -> { id, game, events, upd, src: 'local'|'import' }
let idb = null;
const sumCache = {};
function idbReq(r) { return new Promise((ok, ng) => { r.onsuccess = () => ok(r.result); r.onerror = () => ng(r.error); }); }
function openDB() {
  if (!window.indexedDB) return Promise.resolve(null);
  const r = indexedDB.open('scorebook', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('games', { keyPath: 'id' }); };
  return idbReq(r);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

async function loadGames() {
  try { idb = await openDB(); } catch (e) { idb = null; }
  if (idb) {
    try { (await idbReq(idb.transaction('games').objectStore('games').getAll())).forEach(r => { games[r.id] = r; }); }
    catch (e) { idb = null; }
  }
  if (!idb) { try { games = JSON.parse(lsGet(GKEY) || '{}'); } catch (e) { games = {}; } }
  // 以前の版(1試合だけ保存)のデータを引き継ぐ
  const old = lsGet(KEY);
  if (old) {
    try {
      const o = JSON.parse(old);
      if (o.game) { if (!o.game.id) o.game.id = newGameId(); if (!games[o.game.id]) putGame({ id: o.game.id, game: o.game, events: o.events || [], src: 'local' }); lsSet(CKEY, o.game.id); }
      localStorage.removeItem(KEY);
    } catch (e) { }
  }
  // データベースへの保存は一瞬遅れるため、記録中の試合は localStorage にも即時に写しておき、新しいほうを使う(アプリが落ちても直前の1球まで残す)
  try {
    const j = JSON.parse(lsGet(JKEY) || 'null');
    if (j && j.game && j.game.id) {
      const g = games[j.game.id];
      if (!g || stampOf(j.game, j.events) > stampOf(g.game, g.events) || j.events.length > g.events.length || (j.game.metaAt || 0) > (g.game.metaAt || 0)) putGame({ id: j.game.id, game: j.game, events: j.events, src: g ? g.src : 'local' });
    }
  } catch (e) { }
  const cur = lsGet(CKEY);
  store = cur && games[cur] ? { game: games[cur].game, events: games[cur].events } : { game: null, events: [] };
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { } // 消さない保存領域を申請
}
function putGame(rec) {

  if (idb) { try { idb.transaction('games', 'readwrite').objectStore('games').put(rec); return; } catch (e) { } }
  lsSet(GKEY, JSON.stringify(games));
}
function removeGame(id) {

  try { const j = JSON.parse(lsGet(JKEY) || 'null'); if (j && j.game && j.game.id === id) lsSet(JKEY, ''); } catch (e) { }

  lsSet(GKEY, JSON.stringify(games));
}
// 1球ごとに呼ばれる:記録中の試合を保存
function save() {
  if (!store.game) { lsSet(CKEY, ''); return; }
  const id = store.game.id, rec = games[id] || { id, src: 'local' };
  rec.game = store.game; rec.events = store.events;
  putGame(rec); lsSet(CKEY, id);
  lsSet(JKEY, JSON.stringify({ game: store.game, events: store.events }));
}
function openGame(id) {
  const r = games[id];
  store = r ? { game: r.game, events: r.events } : { game: null, events: [] };
  lsSet(CKEY, r ? id : ''); recompute();
}
// 試合の計算結果(出来事が変わらなければ使い回す)
function replayRec(r) {
  const ev = r.events, key = ev.length + ':' + (ev.length ? ev[ev.length - 1].at : 0);
  let c = sumCache[r.id];
  if (!c || c.key !== key || c.game !== r.game) c = sumCache[r.id] = { key, game: r.game, s: replay(r.game, ev) };

}
function tName(g, side) { return side === g.ourSide ? g.ourName : g.oppName; }
function gameResult(r) {

}
// 新しさ:最後の出来事の時刻(通算に含めるの切り替えなども含む)
function stampOf(game, events) { let t = game.metaAt || 0; events.forEach(e => { if ((e.at || 0) > t) t = e.at; }); return t; }

// ----- 書き出し・取り込み -----
function gameFileText(r) { return JSON.stringify({ format: 'scorebook-game', version: 2, exportedAt: new Date().toISOString(), game: r.game, events: r.events }); }
function safeName(t) { return String(t || '').replace(/[\\/:*?"<>|\s]/g, ''); }
function gameFileName(g) { return (g.date || '日付なし') + '_vs' + (safeName(g.oppName) || '相手') + '.json'; }
// スマホの共有(LINE・Googleドライブなど)で送る。共有できない端末ではダウンロード
async function shareOrDownload(name, text) {
  let file;
  try { file = new File([text], name, { type: 'application/json' }); } catch (e) { file = null; }
  try { if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return 'share'; } }
  catch (e) { if (e && e.name === 'AbortError') return 'abort'; }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file || new Blob([text], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return 'download';
  } catch (e) { return 'fail'; }
}
function mergeGame(d, cnt) {
  const g = d.game; if (!g || !Array.isArray(d.events)) return;

  const a = stampOf(cur.game, cur.events), b = stampOf(g, d.events);
  if (b > a || (b === a && d.events.length > cur.events.length)) {
    putGame({ id: g.id, game: g, events: d.events, src: cur.src }); delete sumCache[g.id]; cnt.upd++;

}
// 試合ファイル・バックアップ・名簿のどれでも取り込める
function importText(text, cnt) {
  const d = JSON.parse(text);

    if (d.roster) { const r = rosterImport(JSON.stringify(Object.assign({ format: 'scorebook-roster', version: 1 }, d.roster))); cnt.radd += r.add; cnt.rupd += r.upd; }
    (d.games || []).forEach(x => mergeGame(x, cnt));
  } else if (d.format === 'scorebook-roster') { const r = rosterImport(text); cnt.radd += r.add; cnt.rupd += r.upd; }
  else if ((d.format === 'scorebook' || d.format === 'scorebook-game') && d.game) mergeGame(d, cnt);

}

function cntText(c) {

// ----- 通算成績(管理者用の端末だけ) -----
// 成績の持ち主:名簿のIDがあればID、なければ背番号+名前(古い記録)
function pidOf(k) { const p = k.split(':'); return p[1] === 'id' ? 'r:' + p[2] : 'n:' + p[1] + ':' + p.slice(2).join(':'); }
function pname(pid, fallback) {
  if (pid.startsWith('r:')) { const p = rp(pid.slice(2)); if (p) return { label: rlabel(p), no: p.no, tag: p.left ? '退団' : p.prov ? '仮' : '' }; }

}
function addInto(dst, src, keys) { keys.forEach(k => { dst[k] = (dst[k] || 0) + (src[k] || 0); }); }
const BAT_K = ['PA', 'AB', 'H', 'H2', 'H3', 'HR', 'RBI', 'R', 'BB', 'HBP', 'K', 'SB', 'SH', 'SF'];

const FLD_K = ['PO', 'A', 'E', 'PB', 'CS', 'SBA'];
function careerData(year, type) {

  const bat = {}, pit = {}, fld = {}, apps = {}, team = { G: recs.length, W: 0, L: 0, D: 0, RS: 0, RA: 0, open: 0 }, inn = {};
  const ent = (map, pid, label) => (map[pid] = map[pid] || { pid, label });
  recs.forEach(r => {
    const s = replayRec(r), o = r.game.ourSide, seen = new Set();
    const res = gameResult(r); team.RS += res.us; team.RA += res.them;
    if (!res.over) team.open++; else if (res.wl === '勝') team.W++; else if (res.wl === '負') team.L++; else team.D++;
    inn[r.game.innings] = (inn[r.game.innings] || 0) + 1;
    Object.entries(s.bat).forEach(([k, v]) => { if (v.side !== o) return; const id = pidOf(k); addInto(ent(bat, id, v.label), v, BAT_K); seen.add(id); });
    Object.entries(s.pit).forEach(([k, v]) => { if (v.side !== o || !v.P && !v.OUT) return; const id = pidOf(k), e = ent(pit, id, v.label); addInto(e, v, PIT_K); e.APP = (e.APP || 0) + 1; seen.add(id); });
    Object.entries(s.fld).forEach(([k, v]) => { if (v.side !== o) return; const id = pidOf(k); addInto(ent(fld, id, v.label), v, FLD_K); seen.add(id); });
    seen.forEach(id => { apps[id] = (apps[id] || 0) + 1; });

    case 'drop': if (S.over || fieldPosProblem()) return; ui.modal = { kind: 'play', step: 'drop', dkind: 'S', fielders: [], moves: {} }; return render();
    case 'dk': m.dkind = k; return render();
    case 'dsafe': case 'dout': {
      const safe = a === 'dsafe';
      m.result = m.dkind === 'C' ? 'KC' : 'K';
      m.drop = safe ? { safe: true, cause: k } : { safe: false };
      // セーフのときは打者走者の行き先も選べる(初期値は1塁)。アウトは打者アウトに決まる
      if (safe) delete m.fixedB; else m.fixedB = 'out';
      m.moves = {};
      for (const mv of dropMoves(S.bases, safe)) m.moves[mv.from] = mv.to;
      if (!safe || k === 'E') { m.fielders = ['2', '3']; m.step = 'fielders'; m.err = ''; return render(); }
      m.step = 'runners'; m.err = ''; return render();
    }
    case 'mv': {
      const to = t.dataset.t === 'out' ? 'out' : parseInt(t.dataset.t, 10);
      m.moves[t.dataset.f] = to; m.err = '';
      if (m.kind === 'run' && to === 'out' && !(m.rf && m.rf.length)) m.rf = runOutDefault(m.reason, parseInt(t.dataset.f, 10));
      if (m.kind === 'play' && m.result === 'GO' && bf(m) === null) {
        // ゴロ:走者をアウトにしたら、打者は一塁セーフに切り替える(打者の行き先を手で選んだあとは切り替えない)
        if (t.dataset.f === 'B') m.bTouched = true;
        else if (!m.bTouched) {
          const runnerOut = Object.keys(m.moves).some(f => f !== 'B' && S.bases[f - 1] && m.moves[f] === 'out');
          m.moves.B = runnerOut ? 1 : 'out';
        }
      }
      return render();
    }
    case 'pok': {
      const list = playMoves(m);
      if (list.find(x => x.from === 'B').to == null) { m.err = '打者の行き先を選んでください'; return render(); }
      const err = validateMoves(list); if (err) { m.err = err; return render(); }
      ui.modal = null; return commitPlay(m, playEvent(m, list));
    }
    case 'run': case 'runtap':
      if (S.over || fieldPosProblem()) return;
      if (!S.bases.some(Boolean)) return toast('塁上に走者がいません');
      ui.modal = { kind: 'run', reason: null, moves: {}, focus: a === 'runtap' ? parseInt(k, 10) : null };
      for (let b = 1; b <= 3; b++) if (S.bases[b - 1]) ui.modal.moves[b] = b;
      return render();
    case 'rsn': {
      m.reason = k; m.err = ''; m.rf = [];
      if (k === 'E') { m.ep = m.ep || []; m.ef = m.ef || ''; m.ek = m.ek || 'throw'; }
      // 初期値:ボークは全員1つ進塁。走者をタップして開いたときは、その走者を1つ先の塁(アウトの理由ならアウト)に
      for (let b = 1; b <= 3; b++) if (S.bases[b - 1]) m.moves[b] = (k === 'BK') ? Math.min(b + 1, 4) : b;
      if (m.focus && k !== 'BK') {
        if (ADV_REASONS.includes(k)) m.moves[m.focus] = Math.min(m.focus + 1, 4);
        else { m.moves[m.focus] = 'out'; m.rf = runOutDefault(k, m.focus); }
      }
      return render();
    }
    case 'ref': m.ef = k; m.err = ''; return render();
    case 'rek': m.ek = k; return render();
    case 'prun': { // 走者の画面から代走
      const r = S.bases[parseInt(k, 10) - 1]; if (!r) return;
      ui.modal = { kind: 'sub', side: S.half, sel: r.slot, overs: [{}, {}], manual: false }; return render();
    }
    case 'rep': { m.ep = (m.ep || []).concat(k); m.ef = k; m.ek = m.ep.length > 1 ? 'catch' : 'throw'; m.err = ''; return render(); }
    case 'repclr': m.ep = []; m.ef = ''; return render();
    case 'rlater': m.later = true; m.err = ''; return render();
    case 'ginfo': ui.modal = { kind: 'ginfo', id: k }; return render();
    case 'ginfook': return saveGinfo();
    case 'latlist': ui.modal = { kind: 'later' }; return render();
    case 'edit': { const i = parseInt(k, 10); if (!editable({ idx: i })) return; ui.modal = null; return startEdit(i); }
    case 'rok': case 'rchain': {
      const ev = buildRunEv(m); if (!ev) return render();
      if (a === 'rok' && m.editIdx != null) { ui.modal = null; return replaceEvent(m.editIdx, ev); }
      if (a === 'rchain' && m.editIdx != null) { m.err = '直すときは、続けての記録はできません'; return render(); }
      if (a === 'rok') {
        const evs = (m.chain || []).concat(ev);
        if (evs.length > 1) { const grp = Date.now(); evs.forEach(e => { e.grp = grp; }); }
        ui.modal = null; return push(evs);
      }
      // 続けて:いまの動きを仮に当てはめた状況で、次の動きを選ぶ(確定でまとめて記録。キャンセルで全部やめる)
      m.chain = (m.chain || []).concat(ev);
      S = replay(store.game, store.events.concat(m.chain));
      m.chainText = (m.chainText || []).concat(S.log[S.log.length - 1].text);
      if (m.focus) { const mv = ev.moves.find(x => x.from === m.focus); m.focus = mv ? (typeof mv.to === 'number' && mv.to < 4 ? mv.to : null) : m.focus; }
      if (!S.bases.some(Boolean) || S.over || S.outs >= 3) { // 塁上に走者がいなくなった:ここまでをまとめて記録
        const grp = Date.now(), evs = m.chain; if (evs.length > 1) evs.forEach(e => { e.grp = grp; });
        ui.modal = null; recompute(); return push(evs);
      }
      m.reason = null; m.moves = {}; m.rf = []; m.ep = []; m.ef = ''; m.err = '';
      for (let b = 1; b <= 3; b++) if (S.bases[b - 1]) m.moves[b] = b;
      return render();
    }
    case 'sub': openField(1 - S.half, null); return render();
    case 'fieldopen': openField(parseInt(k, 10), null); return render();
    case 'fside': m.side = parseInt(k, 10); m.sel = null; m.err = ''; return render();
    case 'fsel': {
      if (fdragJust) return;
      const i = parseInt(k, 10); m.sel = m.sel === i ? null : i; m.err = ''; return render();
    }
    case 'fzone':
      if (fdragJust || m.sel == null) return;
      fieldMove(m, m.sel, k); m.sel = null; return render();
    case 'fbsel':
      if (fdragJust) return;
      m.err = '交代で退く選手を先にタップしてください(または控え選手を、その選手の上へドラッグ)'; return render();
    case 'fbench': { const p = benchAvail(m, m.side)[parseInt(k, 10)]; if (p && stagePlayer(m, p)) m.sel = null; return render(); }
    case 'froster': {
      const np = rosterOutside(m, m.side).find(p => p.rid === k); if (!np) return render();
      const known = rosterCount(m.side); Object.values(m.overs[m.side]).forEach(p => known.add(ident(p)));
      if (!known.has(ident(np)) && known.size >= 25) { m.err = 'ベンチ入りは25名までです'; return render(); }
      if (stagePlayer(m, np)) m.sel = null; return render();
    }
    case 'fdesel': m.sel = null; m.err = ''; return render();
    case 'fundo1': delete m.overs[m.side][m.sel]; m.err = ''; return render();
    case 'flist': ui.modal = { kind: 'sub', side: m.side, sel: m.sel, overs: m.overs, manual: m.sel != null }; return render();
    case 'fok': {
      const bad = [0, 1].filter(sd => Object.keys(m.overs[sd]).length && workProblems(subWork(m, sd)).length);
      if (bad.length) { m.err = '守備位置がそろっていません'; return render(); }
      return doSub();
    }
    case 'subq': {
      // 打席の「代打」は攻撃側の打者(打順の一覧)、投手の「交代」は守備側の投手を選んだ状態でグラウンドの図を開く
      if (k === 'p') { openField(1 - S.half, (currentPitcher(S) || {}).slot); return render(); }
      const side = a === 'subq' && k === 'ph' ? S.half : 1 - S.half;
      const sel = a !== 'subq' ? null : k === 'ph' ? S.next[S.half] : (currentPitcher(S) || {}).slot;
      ui.modal = { kind: 'sub', side, sel: sel == null ? null : sel, overs: [{}, {}], manual: false }; return render();
    }
    case 'sside': m.side = parseInt(k, 10); m.sel = null; m.manual = false; m.err = ''; return render();
    case 'sslot': { const i = parseInt(k, 10); m.sel = m.sel === i ? null : i; m.manual = false; m.mno = m.mnm = ''; m.err = ''; return render(); }
    case 'sbench': { const p = benchAvail(m, m.side)[parseInt(k, 10)]; if (p && stagePlayer(m, p)) m.sel = null; return render(); }
    case 'spos': stagePos(m, k); return render();
    case 'smtog': m.manual = true; return render();
    case 'sundo1': delete m.overs[m.side][m.sel]; m.err = ''; return render();
    case 'sroster': case 'smanual': {
      const isOur = m.side === store.game.ourSide;
      let np;
      if (a === 'sroster') np = rosterOutside(m, m.side).find(p => p.rid === k);
      else {
        const no = document.getElementById('mno').value.trim(), name = document.getElementById('mnm').value.trim();
        const gr = document.getElementById('mgr');
        m.mno = no; m.mnm = name; if (gr) m.mgr = gr.value;
        if (!no) { m.err = '背番号を入力してください'; return render(); }
        if (isOur) {
          if (!name) { m.err = '名前を入力してください(あとで名簿の選手と結び付けるため)'; return render(); }
          const same = activePlayers().find(p => p.no === no);
          if (same) { m.err = '#' + no + ' は名簿にいます(' + rlabel(same) + ')。上の一覧から選んでください'; return render(); }
          np = { no, name, grade: gr ? gr.value : '', isNew: true };
        } else np = { no, name };
      }
      if (!np) return render();
      const known = rosterCount(m.side);
      Object.values(m.overs[m.side]).forEach(p => known.add(ident(p)));
      if (!np.isNew && !known.has(ident(np)) && known.size >= 25 || np.isNew && known.size >= 25) { m.err = 'ベンチ入りは25名までです'; return render(); }
      if (np.isNew) { const rp2 = addRosterPlayer(np.no, np.name, np.grade); np = { no: rp2.no, name: rp2.name, grade: rp2.grade, rid: rp2.id }; }
      if (stagePlayer(m, np)) { m.sel = null; m.manual = false; }
      return render();
    }
    case 'sok': return doSub();
    case 'undo': {
      const ev = store.events.pop();
      let n = 1;
      while (ev.grp && store.events.length && store.events[store.events.length - 1].grp === ev.grp) { store.events.pop(); n++; }
      save(); recompute();
      const PN = { B: 'ボール', C: '見逃し', S: '空振り', F: 'ファウル', BF: 'バントファウル', HBP: '死球' };
      return toast('戻しました:' + (ev.t === 'pitch' ? (ev.kind === 'X' ? RESULTS[ev.result].label : PN[ev.kind]) : ev.t === 'runner' ? RUN_REASONS[ev.reason] : ev.t === 'sub' ? '交代' + (n > 1 ? '(' + n + '件まとめて)' : '') : '試合終了'));
    }
    case 'end':
      ui.modal = { kind: 'confirm', title: '試合を終了しますか?', text: '規定の回が終わったときやサヨナラは、アプリが自動で終わります。手で終わらせるのは、時間切れ・コールドなどのときです。理由を選んでください。終了後も「1つ戻す」で取り消せます。', choices: ['試合終了', '時間切れ', 'コールド', 'その他'], onok: i => push({ t: 'end', reason: ['試合終了', '時間切れ', 'コールド', '試合終了'][i] }) };
      return render();
    case 'cfm': { const f = m.onok; ui.modal = null; f(parseInt(k, 10)); return render(); }
    case 'close': { const tmp = m && (m.chain || m.editIdx != null); ui.modal = null; if (tmp) recompute(); return render(); }
    case 'copy': {
      const ta = document.getElementById('expt');
      try { navigator.clipboard.writeText(ta.value).then(() => toastOnly('コピーしました'), () => { ta.select(); toastOnly('選択しました。長押しでコピーしてください'); }); }
      catch (err) { ta.select(); toastOnly('選択しました。長押しでコピーしてください'); }
      return;
    }
    case 'newgame': ui.view = 'setup'; ui.draft = null; render(); window.scrollTo(0, 0); return;
    case 'tolist': ui.view = null; ui.tab = 'list'; render(); window.scrollTo(0, 0); return;
    case 'gopen': openGame(k); ui.tab = 'rec'; render(); window.scrollTo(0, 0); return;
    case 'gexp': ui.modal = { kind: 'gexp', id: k }; return render();
    case 'gtext': m.text = gameFileText(games[m.id]); return render();
    case 'gshare': {
      const r = games[m.id];
      shareOrDownload(gameFileName(r.game), gameFileText(r)).then(res => { if (res === 'download') toastOnly('ファイルを保存しました'); else if (res === 'fail') toastOnly('送れませんでした。「文字でコピー」を使ってください'); });
      return;
    }
    case 'gdel': {
      const r = games[k], res = gameResult(r);
      ui.modal = { kind: 'confirm', title: 'この試合を削除しますか?', text: r.game.date + ' 対 ' + r.game.oppName + '(' + (res.over ? res.us + '-' + res.them : '記録中') + ')。元に戻せません。' + (r.src === 'local' && !isAdmin() ? '管理者に送ったか確かめてください。' : ''),
        onok: () => { if (store.game && store.game.id === k) { store = { game: null, events: [] }; lsSet(CKEY, ''); recompute(); } removeGame(k); toastOnly('削除しました'); } };
      return render();
    }
    case 'gimp': {
      const txt = document.getElementById('gimpt').value.trim(); if (!txt) return toastOnly('貼り付けてから押してください');
      const c = newCnt();
      try { importText(txt, c); } catch (err) { c.bad++; }
      render(); toastOnly(cntText(c)); return;
    }
    case 'bexp': {
      shareOrDownload('スコアブック_バックアップ_' + todayStr() + '.json', backupText()).then(res => {
        if (res === 'share' || res === 'download') { roster.lastBackup = todayStr(); saveRoster(); render(); toastOnly('バックアップを保存しました'); }
        else if (res === 'fail') toastOnly('保存できませんでした');
      });
      return;
    }
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('ginc')) { // 通算成績に含める
    const r = games[t.dataset.gi]; if (!r) return;
    r.game.includeTotals = t.checked; r.game.metaAt = Date.now(); putGame(r);
    if (store.game && store.game.id === r.id) save();
    return;
  }
  if (t.dataset && t.dataset.cf) { if (t.dataset.cf === 'y') ui.cy = t.value; else ui.ct = t.value; return render(); }
  if (t.id === 'wkd') { ui.wkd = t.value || null; return render(); }
  if (t.name === 'type' && t.closest('#setup')) { const f = document.getElementById('setup'); f.elements.include.checked = t.value !== 'その他'; return; }
  if (t.id === 'gfile') { // 試合ファイルなどを取り込む(複数可)
    const files = [...t.files], c = newCnt();
    Promise.all(files.map(f => f.text().then(txt => { try { importText(txt, c); } catch (err) { c.bad++; } }))).then(() => { render(); toastOnly(cntText(c)); });
    return;
  }
  if (!t.classList || !t.classList.contains('dpos')) return;
  const d = ui.draft, i = parseInt(t.dataset.i, 10), old = d.order[i].pos, j = d.order.findIndex((o, x) => x !== i && o.pos === t.value);
  if (j >= 0) d.order[j].pos = old;
  d.order[i].pos = t.value; renderOurCard();
});
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') { ui.modal = null; render(); } });
setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = elapsedText(); }, 1000);

// 起動:名簿と全試合を読み込んでから表示する
loadRoster();
loadGames().catch(() => { }).then(() => { recompute(); if (!store.game) ui.tab = 'list'; render(); });

</script>
</body>
